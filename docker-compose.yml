services:
  postgres:
    image: postgres:16-alpine
    container_name: khazprokhir-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-khazprokhir_dev}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d khazprokhir_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    name: khazprokhir_pgdata
